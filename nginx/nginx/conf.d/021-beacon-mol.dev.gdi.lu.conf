server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name beacon-molgenis.dev.gdi.lu;

    ssl_certificate /etc/nginx/ssl/wildcard.dev.gdi.lu.crt;
    ssl_certificate_key /etc/nginx/ssl/wildcard.dev.gdi.lu.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;  # about 40000 sessions
    ssl_session_tickets off;

    # modern configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # HSTS (ngx_http_headers_module is required) (63072000 seconds)
    add_header Strict-Transport-Security "max-age=63072000" always;

    # logging
    #access_log          /var/log/nginx/beacon-mol.access.log combined buffer=512k flush=1m;
    #error_log           /var/log/nginx/beacon-mol.error.log warn;

    # security headers
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy   "default-src 'self' http: https: ws: wss: data: blob: 'unsafe-inline'; frame-ancestors 'self';" always;
    add_header Permissions-Policy        "interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # . files
    location ~ /\.(?!well-known) {
        deny all;
    }
    
    
    location / {
        proxy_http_version                 1.1;
        proxy_cache_bypass                 $http_upgrade;

        # Proxy SSL
        proxy_ssl_server_name              on;

        # Proxy headers
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Forwarded         $proxy_add_forwarded;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Proxy timeouts
        proxy_connect_timeout              180s;
        proxy_send_timeout                 180s;
        proxy_read_timeout                 180s;

	    proxy_pass http://192.168.19.21:8080;

        proxy_set_header Accept-Encoding "";
        sub_filter_types *;
        gzip_static off;
        sub_filter_once off;
        sub_filter '"beaconId" : "org.molgenis.beaconv2"' '"beaconId" : "lu.gdi.starter-kit.production"';
        sub_filter "MOLGENIS EMX2 Beacon v2 at https://beacon.dev.gdi.lu" "European Genomic Data Infrastructure Luxembourgish Beacon";
        sub_filter "https://ror.org/03cv38k47" "LNDS";
        sub_filter '"Genomics Coordination Center",' '"Luxembourg National Data Service",';
        sub_filter 'Genomics Coordination Center at Dept. of Genetics at the University Medical Center Groningen' 'Luxembourg National Data Service - a brand of PNED G.I.E.';
        sub_filter 'Genomics Coordination Center, Department of Genetics, University Medical Center Groningen, Antonius Deusinglaan 1, 9713 AV Groningen, The Netherlands' 'Luxembourg National Data Service - 6, avenue des Hauts-Fourneaux, L-4362 Esch-sur-Alzette, Luxembourg';
        sub_filter '"https://www.molgenis.org/"' '"https://lnds.lu"';
        sub_filter "https://beacon.dev.gdi.lu" "lu.gdi.starter-kit.production";
        sub_filter "https://umcgresearch.org/w/gcc" "https://beacon.dev.gdi.lu";
        sub_filter "https://www.molgenis.org/assets/img/logo_blue.png" "https://gdi.onemilliongenomes.eu/images/gdi-logo.svg";
        sub_filter "mailto:info@molgenis.org" "mailto:info@lnds.lu";
    }
}

