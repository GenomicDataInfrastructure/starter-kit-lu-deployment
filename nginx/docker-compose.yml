version: "3.9"

services:
  nginx:
    image: nginx:latest
    restart: unless-stopped
    
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
    ports:
      - "80:80"
      - "443:443" 
    networks:
      - gdi-node-net


networks:
  gdi-node-net:
    name: gdi-node-net
